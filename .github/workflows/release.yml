name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test and package
        run: mvn --batch-mode test package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="$(find target -maxdepth 1 -type f -name 'ServerHoster-*.jar' -print -quit)"
          test -n "$artifact"
          gh release create "${GITHUB_REF_NAME}" "$artifact" --title "ServerHoster ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
