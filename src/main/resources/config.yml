# Server type: vanilla | fabric | paper | spigot | custom
type: vanilla
mcVersion: "26.3"
# Second open port of the Zap-Hosting package (2064 is kept free, e.g. for a 2nd instance/query)
port: 2063
# Child bind address: "" inherits the host server-ip (which may itself be empty).
# A non-empty value overrides the host address; 0.0.0.0 binds all IPv4 interfaces.
serverIp: ""
# Only used when type: custom (path relative to workingDir, or absolute)
customJar: "server.jar"
# Fabric loader/installer version: "latest" = newest stable
fabricLoaderVersion: latest
fabricInstallerVersion: latest
workingDir: ./child-server
memory:
  xms: 2G
  xmx: 5G
# Keep JVM tuning conservative; Java 25 G1 defaults adapt to the heap and workload.
jvmFlags:
  - -XX:+UseG1GC
# Extra args after "nogui"
serverArgs: []
autoStart: true
autoRestart:
  enabled: true
  # Pause automatic retries after this many failed restarts; change in Dashboard > Einstellungen.
  maxAttempts: 5
  initialDelaySeconds: 5
  maxDelaySeconds: 300
  # Backoff resets after the child has been up this long
  resetAfterSeconds: 600
stopTimeoutSeconds: 60
# Time to wait for the vanilla server's "Done" line before sending a queued stop.
startupStopTimeoutSeconds: 180
# Read-only cgroup sampling. Emergency shutdown is used only when a finite cgroup limit is known.
memoryProtection:
  policyVersion: 4
  sampleIntervalSeconds: 15
  warningPercent: 85
  criticalPercent: 95
  criticalSamples: 3
  # On confirmed critical cgroup pressure only the child is stopped; the outer Spigot host is never stopped.
  autoStopChild: true
  warningDelaySeconds: 15
  recoveryPercent: 80
  recoverySamples: 3
  recoveryCooldownSeconds: 180
# Periodic read-only log at plugins/ServerhosterPlugin/memory-telemetry.log.
# Missing keys keep these defaults. The log does not change Xms, Xmx, or JVM flags.
memoryTelemetry:
  enabled: true
  intervalSeconds: 60
  maxBytes: 5000000
# On JVM shutdown (SIGTERM, panel restart) when onDisable may not run
shutdownHookTimeoutSeconds: 25
# Periodic 'save-all' to the child (minutes, 0 = off)
saveAllIntervalMinutes: 5
# Prefix for child console lines in the Spigot log
logPrefix: "[Child] "
# Optional explicit overrides. Unspecified gameplay values keep Minecraft's defaults.
# Child port/IP are set from the network options; pausing while empty is always disabled.
serverProperties: {}
# Lines kept for the dashboard console (SSE ring)
consoleBufferLines: 4000
metadata:
  pluginVersion: 2.4.4
# Web dashboard (JDK HTTP server, optional TLS). Password: plugins/ServerhosterPlugin/dashboard-password.txt
dashboard:
  enabled: true
  port: 2064
  # "" = use the effective child bind address; "0.0.0.0" = all IPv4 interfaces
  bind: ""
  # TLS is off until enabled. Material is created only when the dashboard starts with https.enabled.
  # mode: self-signed | keystore | pem
  https:
    enabled: false
    mode: self-signed
    keystore: dashboard.p12
    keystorePassword: ""
    keyPassword: ""
    cert: dashboard.crt
    key: dashboard.key
    days: 825
    dn: "CN=ServerhosterPlugin"
    sans: []
setup:
  completed: false
# Dashboard-managed hourly, daily, and weekly schedules are stored here.
schedules: []
# Zip of backup.paths inside the profile directory. Created only when a backup runs.
# database.* is an external JDBC target. Nothing is installed locally; driverJar is loaded on use.
# For FTP/FTPS, set storage: remote and configure remote.*. Credentials belong in the local secrets.yml file.
backup:
  storage: local
  directory: ""
  paths:
    - world
  keep: 5
  saveWaitSeconds: 3
  remote:
    protocol: AUTO
    host: ""
    port: 21
    directory: ServerHoster
  database:
    enabled: false
    jdbcUrl: ""
    user: ""
    password: ""
    driverJar: ""
    driverClass: ""
    table: serverhoster_backups
# Optional ntfy alerts. Configure a topic to receive warnings, errors, and automatic recovery notices.
notifications:
  ntfy:
    enabled: false
    server: https://ntfy.sh
    topic: ""
