# Child server type: fabric | paper | spigot | vanilla | custom
type: fabric
mcVersion: "26.3"
# Second open port of the Zap-Hosting package (2064 is kept free, e.g. for a 2nd instance/query)
port: 2063
# Bind address for the child ("" = all interfaces)
serverIp: "0.0.0.0"
# Only used when type: custom (path relative to workingDir, or absolute)
customJar: "server.jar"
# Fabric loader/installer version: "latest" = newest stable
fabricLoaderVersion: latest
fabricInstallerVersion: latest
workingDir: ./child-server
memory:
  xms: 2G
  xmx: 5G
# Keep JVM tuning conservative; Java 25 G1 defaults adapt to the heap and workload.
jvmFlags:
  - -XX:+UseG1GC
# Extra args after "nogui"
serverArgs: []
autoStart: true
autoRestart:
  enabled: true
  initialDelaySeconds: 5
  maxDelaySeconds: 300
  # Backoff resets after the child has been up this long
  resetAfterSeconds: 600
  # 0 = unlimited consecutive restarts
  maxAttempts: 0
stopTimeoutSeconds: 60
# Time to wait for the vanilla server's "Done" line before sending a queued stop.
startupStopTimeoutSeconds: 180
# Read-only cgroup sampling. Emergency shutdown is used only when a finite cgroup limit is known.
memoryProtection:
  policyVersion: 3
  sampleIntervalSeconds: 15
  warningPercent: 85
  criticalPercent: 95
  criticalSamples: 3
  autoShutdown: true
  warningDelaySeconds: 15
  recoveryPercent: 80
  recoverySamples: 3
  recoveryCooldownSeconds: 180
# On JVM shutdown (SIGTERM, panel restart) when onDisable may not run
shutdownHookTimeoutSeconds: 25
# Periodic 'save-all' to the child (minutes, 0 = off)
saveAllIntervalMinutes: 5
# Prefix for child console lines in the Spigot log
logPrefix: "[Child] "
# Modrinth slugs, only used for type fabric (downloaded into workingDir/mods if missing)
mods:
  lithium: true
  ferrite-core: true
  c2me-fabric: false
# Optional explicit overrides. Unspecified gameplay values keep Minecraft's defaults.
# Child port/IP are set from the network options; pausing while empty is always disabled.
serverProperties: {}
# Lines kept for the dashboard console (SSE ring)
consoleBufferLines: 4000
# Web dashboard (JDK HTTP server, optional TLS). Password: plugins/FabricLauncher/dashboard-password.txt
dashboard:
  enabled: true
  port: 2064
  # "" = use serverIp above; "0.0.0.0" = all interfaces
  bind: ""
  # TLS is off until enabled. Material is created only when the dashboard starts with https.enabled.
  # mode: self-signed | keystore | pem
  https:
    enabled: false
    mode: self-signed
    keystore: dashboard.p12
    keystorePassword: ""
    keyPassword: ""
    cert: dashboard.crt
    key: dashboard.key
    days: 825
    dn: "CN=FabricLauncher"
    sans: []
# Id of the root profile (the keys above). Extra profiles live under servers.<id>.
serverId: default
# Profile used by /child and the dashboard when no id is given.
focusServer: default
# Normalbetrieb: ein Child. Ein Start stoppt die anderen, Auto-Start nur für focusServer.
# true lässt mehrere Profile gleichzeitig laufen.
allowParallel: false
# Extra profiles inherit memory, jvmFlags, serverArgs, serverIp, fabric versions and serverProperties.
# They do not inherit mods. A missing workingDir becomes ./child-<id>. Set port per profile.
servers: {}
# Five-field cron: minute hour day-of-month month day-of-week. Both day fields set means OR.
# The default backup runs at 05:00 in the server JVM's local timezone.
tasks:
  - id: daily-backup
    enabled: true
    cron: "0 5 * * *"
    timezone: local
    action: backup
    command: ""
    server: ""
# Zip of backup.paths inside the profile directory. Created only when a backup runs.
# database.* is an external JDBC target. Nothing is installed locally; driverJar is loaded on use.
# For FTP/FTPS, set storage: remote and configure remote.*. Credentials belong in the local secrets.yml file.
backup:
  scheduleDefaultVersion: 1
  storage: local
  directory: ""
  paths:
    - world
  keep: 5
  saveWaitSeconds: 3
  remote:
    protocol: AUTO
    host: ""
    port: 21
    directory: ServerHoster
  database:
    enabled: false
    jdbcUrl: ""
    user: ""
    password: ""
    driverJar: ""
    driverClass: ""
    table: fabriclauncher_backups
# Optional ntfy alerts. Configure a topic to receive warnings, errors, and automatic recovery notices.
notifications:
  ntfy:
    enabled: false
    server: https://ntfy.sh
    topic: ""
# One-time outer setup (void lobby, world move, file neuter) is WorldPorter, not this plugin.
# Install WorldPorter for the first start, then delete it after plugins/WorldPorter/done.marker exists.
