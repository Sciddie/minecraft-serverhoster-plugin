name: FabricLauncher
version: ${project.version}
main: de.aichele.childlauncher.FabricLauncherPlugin
api-version: '26.3'
softdepend: [WorldPorter]
description: ServerHoster. One child at a time unless allowParallel is true.
commands:
  child:
    description: Control the child server
    usage: /child <start|stop|restart|status|cmd|config|prop|mods|mod|diag|threaddump|heap|flags|servers|focus|tasks|task|backup|versions|plan|crashes|jar>
    permission: fabriclauncher.admin
permissions:
  fabriclauncher.admin:
    default: op
