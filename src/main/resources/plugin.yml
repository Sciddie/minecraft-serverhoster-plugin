name: ServerhosterPlugin
version: ${project.version}
main: de.aichele.childlauncher.FabricLauncherPlugin
api-version: '26.3'
description: ServerHoster manages one child server.
commands:
  child:
    description: Control the child server
    usage: /child <start|stop|restart|status|cmd|config|prop|diag|threaddump|heap|flags|tasks|task|backup|versions|plan|crashes|jar>
    permission: serverhoster.admin
permissions:
  serverhoster.admin:
    default: op
